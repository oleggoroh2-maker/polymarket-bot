<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pilot Dashboard</title><style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#151920;--muted:#8e98a8;--line:#272d37;--good:#4bd28a;--bad:#ff6b72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:15px system-ui,-apple-system,sans-serif}.w{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:24px;font-weight:800}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:#fff}.tabs .on{border-color:#78a7ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.big{font-size:28px;font-weight:800}.sec{margin-top:18px}.tw{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;min-width:650px;border-collapse:collapse;background:var(--card)}th,td{padding:11px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.items{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:12px}.trade{color:var(--good);font-weight:700}.skip{color:#f0b55a;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="w"><div class="top"><div><div class="title">🧪 Polymarket Pilot Dashboard</div><div class="muted">PAPER · read-only · refresh 60s</div></div><div id="upd" class="muted">Loading…</div></div><div class="tabs"><button id="v2" class="on" onclick="load('v2')">Pilot v2</button><button id="v3" onclick="loadV3()">Pilot v3 Challenger</button><button id="v4" onclick="loadV4()">Pilot v4 PAPER</button><button id="v1" onclick="load('v1')">Pilot v1</button><button id="auditv2" onclick="loadAudit()">v2 MAX_OPEN Audit</button><button id="exitaudit" onclick="loadExitAudit()">Position / Exit Audit</button><button id="oosreview" onclick="loadOOSReview()">OOS Review #1</button><button id="oosreview2" onclick="loadOOSReview2()">OOS Review #2</button><button id="oosreview3" onclick="loadOOSReview3()">OOS Review #3</button><button id="marketregime" onclick="loadMarketRegime()">Market Context Audit</button><button id="categoryfilter" onclick="loadCategoryFilter()">Category Filter Audit</button><button id="contextv2" onclick="loadContextV2()">Market Context v2</button><button id="stability" onclick="loadStability()">v2 Stability 100</button><button id="oossummary" onclick="loadOOSSummary()">OOS 1–45</button></div><div id="app"></div></div><script>
let current='v2';const f=(v,d=1)=>v==null?'—':Number(v).toFixed(d),cl=v=>Number(v)>0?'good':Number(v)<0?'bad':'',hn=k=>({180:'3h',360:'6h',720:'12h',1440:'24h'})[k]||k;
function drawAudit(r){let h=r.horizons||{};let out=`<div class="grid"><div class="card"><div class="muted">V2 TRADE</div><div class="big">${r.trade_total||0}</div></div><div class="card"><div class="muted">MAX_OPEN SKIP</div><div class="big">${r.max_open_skip_total||0}</div></div><div class="card"><div class="muted">MODE</div><div class="big">READ-ONLY</div></div></div>`;out+=`<div class="sec"><h3>TRADE vs MAX_OPEN SKIP</h3><div class="tw"><table><tr><th>Horizon</th><th>Trade n</th><th>Trade ROI</th><th>Skip n</th><th>Skip ROI</th><th>Skip PF</th><th>Δ ROI</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.trade.n}</td><td class="${cl(x.trade.roi)}">${f(x.trade.roi)}%</td><td>${x.max_open_skip.n}</td><td class="${cl(x.max_open_skip.roi)}">${f(x.max_open_skip.roi)}%</td><td>${f(x.max_open_skip.pf,2)}</td><td class="${cl(x.roi_delta_skip_minus_trade)}">${f(x.roi_delta_skip_minus_trade)} pp</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>Recent MAX_OPEN skips</h3><div class="items">${(r.recent_max_open_skips||[]).map(x=>`<div class="item"><div>${x[0]}</div><div class="muted">${x[1]} · ${(Number(x[2])*100).toFixed(1)}¢ · Early ${f(x[3],1)} · A ${f(x[4],3)}</div></div>`).join('')||'<div class="muted">No MAX_OPEN skips</div>'}</div></div>`;document.getElementById('app').innerHTML=out}
function drawExitAudit(r){let h=r.horizons||{},tr=r.transitions||{},best=r.best_horizon_counts||{};let out=`<div class="grid"><div class="card"><div class="muted">V2 TRADES SEEN</div><div class="big">${r.trade_total||0}</div></div><div class="card"><div class="muted">COMPLETE 24H</div><div class="big">${r.complete_24h_trades||0}</div></div><div class="card"><div class="muted">MODE</div><div class="big">READ-ONLY</div></div></div>`;out+=`<div class="sec"><h3>Outcome by holding horizon</h3><div class="tw"><table><tr><th>Horizon</th><th>n</th><th>ROI</th><th>PF</th><th>Win</th><th>Median</th><th>PnL</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.n}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td><td class="${cl(x.pnl)}">$${f(x.pnl,2)}</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>How positions changed while holding</h3><div class="tw"><table><tr><th>Period</th><th>n</th><th>Improved</th><th>Declined</th><th>Unchanged</th><th>Avg Δ ROI</th><th>Median Δ</th></tr>${Object.entries(tr).map(([k,x])=>`<tr><td>${k}</td><td>${x.n}</td><td>${x.improved}</td><td>${x.declined}</td><td>${x.unchanged}</td><td class="${cl(x.avg_delta_roi)}">${f(x.avg_delta_roi)} pp</td><td class="${cl(x.median_delta_roi)}">${f(x.median_delta_roi)} pp</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>Best observed checkpoint per complete trade</h3><div class="card">${['3h','6h','12h','24h'].map(k=>`${k}: <b>${best[k]||0}</b>`).join(' · ')}</div></div>`;out+=`<div class="sec"><h3>Recent complete trades</h3><div class="items">${(r.recent_complete||[]).map(x=>`<div class="item"><div class="row"><span>${x.title}</span><b>${x.best_horizon} best</b></div><div class="muted">3h ${f(x.rois['3h'])}% · 6h ${f(x.rois['6h'])}% · 12h ${f(x.rois['12h'])}% · 24h ${f(x.rois['24h'])}%</div></div>`).join('')||'<div class="muted">No complete 24h trades yet</div>'}</div></div>`;document.getElementById('app').innerHTML=out}

function drawOOSReview(r){let h=r.horizons||{},best=r.best_horizon_counts||{},bucket=(title,a)=>`<div class="sec"><h3>${title}</h3><div class="tw"><table><tr><th>Bucket</th><th>n</th><th>24h ROI</th><th>PF</th><th>Win</th><th>Median</th></tr>${(a||[]).map(x=>`<tr><td>${x.label}</td><td>${x.n}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td></tr>`).join('')}</table></div></div>`;let out=`<div class="grid"><div class="card"><div class="muted">MILESTONE COHORT</div><div class="big">${r.cohort_n}/${r.milestone_n}</div></div><div class="card"><div class="muted">24H AVAILABLE NOW</div><div class="big">${r.available_complete_24h||0}</div></div><div class="card"><div class="muted">MODE</div><div class="big">READ-ONLY</div></div></div><div class="sec"><div class="card"><b>${r.locked_definition||''}</b><div class="muted">Frozen analytical definition: later trades do not rewrite Review #1.</div></div></div>`;out+=`<div class="sec"><h3>Milestone cohort by horizon</h3><div class="tw"><table><tr><th>Horizon</th><th>n</th><th>ROI</th><th>PF</th><th>Win</th><th>Median</th><th>PnL</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.n}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td><td class="${cl(x.pnl)}">$${f(x.pnl,2)}</td></tr>`).join('')}</table></div></div>`;out+=bucket('24h result by entry price',r.price_buckets)+bucket('24h result by Early score',r.early_buckets)+bucket('24h result by Acceleration',r.accel_buckets);out+=`<div class="sec"><h3>Best checkpoint in first 15</h3><div class="card">${['3h','6h','12h','24h'].map(k=>`${k}: <b>${best[k]||0}</b>`).join(' · ')}</div></div>`;let sk=r.max_open_skip_24h||{};out+=`<div class="sec"><h3>MAX_OPEN skips with 24h outcome (context)</h3><div class="card">n <b>${sk.n||0}</b> · ROI <span class="${cl(sk.roi)}">${f(sk.roi)}%</span> · PF <b>${f(sk.pf,2)}</b> · Win ${f(sk.win)}% · Median ${f(sk.median)}%</div></div>`;let items=(a)=>a.map(x=>`<div class="item"><div class="row"><span>${x.title}</span><b class="${cl(x.roi24)}">${f(x.roi24)}%</b></div><div class="muted">${(Number(x.price)*100).toFixed(1)}¢ · Early ${f(x.early,1)} · A ${f(x.accel,3)}</div></div>`).join('');out+=`<div class="sec"><h3>Top 24h outcomes</h3><div class="items">${items(r.top_24h||[])}</div></div><div class="sec"><h3>Bottom 24h outcomes</h3><div class="items">${items(r.bottom_24h||[])}</div></div>`;document.getElementById('app').innerHTML=out}


function drawOOSReview2(r){let h=r.horizons||{},best=r.best_horizon_counts||{},cmp=r.comparison||{},rob=r.robustness||{},bucket=(title,a)=>`<div class="sec"><h3>${title}</h3><div class="tw"><table><tr><th>Bucket</th><th>n</th><th>24h ROI</th><th>PF</th><th>Win</th><th>Median</th></tr>${(a||[]).map(x=>`<tr><td>${x.label}</td><td>${x.n}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td></tr>`).join('')}</table></div></div>`;let out=`<div class="grid"><div class="card"><div class="muted">COHORT 16–30</div><div class="big">${r.cohort_n}/${r.milestone_n}</div></div><div class="card"><div class="muted">24H AVAILABLE NOW</div><div class="big">${r.available_complete_24h||0}</div></div><div class="card"><div class="muted">MODE</div><div class="big">READ-ONLY</div></div></div><div class="sec"><div class="card"><b>${r.locked_definition||''}</b><div class="muted">Frozen analytical definition: later trades do not rewrite Review #2.</div></div></div>`;out+=`<div class="sec"><h3>Review #2 by horizon</h3><div class="tw"><table><tr><th>Horizon</th><th>n</th><th>ROI</th><th>PF</th><th>Win</th><th>Median</th><th>PnL</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.n}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td><td class="${cl(x.pnl)}">$${f(x.pnl,2)}</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>Review #1 vs Review #2</h3><div class="tw"><table><tr><th>Horizon</th><th>#1 n</th><th>#1 ROI</th><th>#1 PF</th><th>#2 n</th><th>#2 ROI</th><th>#2 PF</th><th>Δ ROI</th></tr>${Object.entries(cmp).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.review1.n}</td><td class="${cl(x.review1.roi)}">${f(x.review1.roi)}%</td><td>${f(x.review1.pf,2)}</td><td>${x.review2.n}</td><td class="${cl(x.review2.roi)}">${f(x.review2.roi)}%</td><td>${f(x.review2.pf,2)}</td><td class="${cl(x.roi_delta)}">${f(x.roi_delta)} pp</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>Robustness — influence of one extreme trade</h3><div class="tw"><table><tr><th>Horizon</th><th>Normal ROI</th><th>Without best</th><th>Without worst</th><th>Without both</th><th>Best trade</th><th>Worst trade</th></tr>${Object.entries(rob).map(([k,x])=>`<tr><td>${hn(k)}</td><td class="${cl(x.full.roi)}">${f(x.full.roi)}%</td><td class="${cl(x.without_best.roi)}">${f(x.without_best.roi)}%</td><td class="${cl(x.without_worst.roi)}">${f(x.without_worst.roi)}%</td><td class="${cl(x.without_both.roi)}">${f(x.without_both.roi)}%</td><td class="${cl(x.best)}">${f(x.best)}%</td><td class="${cl(x.worst)}">${f(x.worst)}%</td></tr>`).join('')}</table></div><div class="muted" style="margin-top:8px">Diagnostic only: extreme trades remain in the canonical OOS result.</div></div>`;out+=bucket('24h result by entry price',r.price_buckets)+bucket('24h result by Early score',r.early_buckets)+bucket('24h result by Acceleration',r.accel_buckets);out+=`<div class="sec"><h3>Best checkpoint in trades 16–30</h3><div class="card">${['3h','6h','12h','24h'].map(k=>`${k}: <b>${best[k]||0}</b>`).join(' · ')}</div></div>`;let items=(a)=>a.map(x=>`<div class="item"><div class="row"><span>${x.title}</span><b class="${cl(x.roi24)}">${f(x.roi24)}%</b></div><div class="muted">${(Number(x.price)*100).toFixed(1)}¢ · Early ${f(x.early,1)} · A ${f(x.accel,3)}</div></div>`).join('');out+=`<div class="sec"><h3>Top 24h outcomes</h3><div class="items">${items(r.top_24h||[])}</div></div><div class="sec"><h3>Bottom 24h outcomes</h3><div class="items">${items(r.bottom_24h||[])}</div></div>`;document.getElementById('app').innerHTML=out}
function drawOOSReview3(r){let h=r.horizons||{},best=r.best_horizon_counts||{},cmp=r.comparison||{},rob=r.robustness||{},bucket=(title,a)=>`<div class="sec"><h3>${title}</h3><div class="tw"><table><tr><th>Bucket</th><th>n</th><th>24h ROI</th><th>PF</th><th>Win</th><th>Median</th></tr>${(a||[]).map(x=>`<tr><td>${x.label}</td><td>${x.n}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td></tr>`).join('')}</table></div></div>`;let out=`<div class="grid"><div class="card"><div class="muted">COHORT 31–45</div><div class="big">${r.cohort_n}/${r.milestone_n}</div></div><div class="card"><div class="muted">24H AVAILABLE NOW</div><div class="big">${r.available_complete_24h||0}</div></div><div class="card"><div class="muted">MODE</div><div class="big">READ-ONLY</div></div></div><div class="sec"><div class="card"><b>${r.locked_definition||''}</b><div class="muted">Frozen analytical definition: later trades do not rewrite Review #3.</div></div></div>`;out+=`<div class="sec"><h3>Review #3 by horizon</h3><div class="tw"><table><tr><th>Horizon</th><th>n</th><th>ROI</th><th>PF</th><th>Win</th><th>Median</th><th>PnL</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.n}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td><td class="${cl(x.pnl)}">$${f(x.pnl,2)}</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>Review #1 vs Review #3</h3><div class="tw"><table><tr><th>Horizon</th><th>#1 n</th><th>#1 ROI</th><th>#1 PF</th><th>#3 n</th><th>#3 ROI</th><th>#3 PF</th><th>Δ ROI</th></tr>${Object.entries(cmp).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.review1.n}</td><td class="${cl(x.review1.roi)}">${f(x.review1.roi)}%</td><td>${f(x.review1.pf,2)}</td><td>${x.review2.n}</td><td class="${cl(x.review2.roi)}">${f(x.review2.roi)}%</td><td>${f(x.review2.pf,2)}</td><td class="${cl(x.roi_delta)}">${f(x.roi_delta)} pp</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>Robustness — influence of one extreme trade</h3><div class="tw"><table><tr><th>Horizon</th><th>Normal ROI</th><th>Without best</th><th>Without worst</th><th>Without both</th><th>Best trade</th><th>Worst trade</th></tr>${Object.entries(rob).map(([k,x])=>`<tr><td>${hn(k)}</td><td class="${cl(x.full.roi)}">${f(x.full.roi)}%</td><td class="${cl(x.without_best.roi)}">${f(x.without_best.roi)}%</td><td class="${cl(x.without_worst.roi)}">${f(x.without_worst.roi)}%</td><td class="${cl(x.without_both.roi)}">${f(x.without_both.roi)}%</td><td class="${cl(x.best)}">${f(x.best)}%</td><td class="${cl(x.worst)}">${f(x.worst)}%</td></tr>`).join('')}</table></div><div class="muted" style="margin-top:8px">Diagnostic only: extreme trades remain in the canonical OOS result.</div></div>`;out+=bucket('24h result by entry price',r.price_buckets)+bucket('24h result by Early score',r.early_buckets)+bucket('24h result by Acceleration',r.accel_buckets);out+=`<div class="sec"><h3>Best checkpoint in trades 31–45</h3><div class="card">${['3h','6h','12h','24h'].map(k=>`${k}: <b>${best[k]||0}</b>`).join(' · ')}</div></div>`;let items=(a)=>a.map(x=>`<div class="item"><div class="row"><span>${x.title}</span><b class="${cl(x.roi24)}">${f(x.roi24)}%</b></div><div class="muted">${(Number(x.price)*100).toFixed(1)}¢ · Early ${f(x.early,1)} · A ${f(x.accel,3)}</div></div>`).join('');out+=`<div class="sec"><h3>Top 24h outcomes</h3><div class="items">${items(r.top_24h||[])}</div></div><div class="sec"><h3>Bottom 24h outcomes</h3><div class="items">${items(r.bottom_24h||[])}</div></div>`;document.getElementById('app').innerHTML=out}

function draw(r){let c=r.counts||{},h=r.horizons||{},rec=r.recent||[],reasons=r.reasons||[];let out=`<div class="grid"><div class="card"><div class="muted">TRADE</div><div class="big">${c.TRADE||0}</div></div><div class="card"><div class="muted">SKIP</div><div class="big">${c.SKIP||0}</div></div><div class="card"><div class="muted">OPEN</div><div class="big">${r.open??'—'}</div></div></div>`;out+=`<div class="sec"><h3>Outcomes</h3><div class="tw"><table><tr><th>Horizon</th><th>n</th><th>ROI</th><th>PF</th><th>Win</th><th>Median</th><th>PnL</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.n||0}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td><td class="${cl(x.pnl)}">$${f(x.pnl,2)}</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>SKIP reasons</h3><div class="card">${reasons.length?reasons.map(x=>`${x[0]}: <b>${x[1]}</b>`).join(' · '):'No skips'}</div></div>`;out+=`<div class="sec"><h3>Recent decisions</h3><div class="items">${rec.map(x=>`<div class="item"><div class="row"><span>${x[0]}</span><span class="${x[1]=='TRADE'?'trade':'skip'}">${x[1]}</span></div><div class="muted">${x[2]} · ${(Number(x[3])*100).toFixed(1)}¢ · A ${f(x[4],3)} · $${f(x[5],0)}</div></div>`).join('')||'<div class="muted">No recent decisions</div>'}</div></div>`;document.getElementById('app').innerHTML=out}
async function load(v){current=v;document.getElementById('v1').classList.toggle('on',v==='v1');document.getElementById('v2').classList.toggle('on',v==='v2');document.getElementById('v3').classList.remove('on');document.getElementById('auditv2').classList.remove('on');document.getElementById('exitaudit').classList.remove('on');document.getElementById('oosreview').classList.remove('on');document.getElementById('oosreview2').classList.remove('on');document.getElementById('oosreview3').classList.remove('on');document.getElementById('oossummary').classList.remove('on');try{let q=await fetch('/api/pilot/'+v,{cache:'no-store'}),j=await q.json();if(!j.ok)throw Error(j.message||j.error);draw(j.report);document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){document.getElementById('app').innerHTML='<div class="card bad">'+e.message+'</div>'}}async function loadAudit(){current='auditv2';document.getElementById('v1').classList.remove('on');document.getElementById('v2').classList.remove('on');document.getElementById('v3').classList.remove('on');document.getElementById('auditv2').classList.add('on');document.getElementById('exitaudit').classList.remove('on');document.getElementById('oosreview').classList.remove('on');document.getElementById('oosreview2').classList.remove('on');document.getElementById('oosreview3').classList.remove('on');document.getElementById('oossummary').classList.remove('on');try{let q=await fetch('/api/pilot/v2/audit',{cache:'no-store'}),j=await q.json();if(!j.ok)throw Error(j.message||j.error);drawAudit(j.report);document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){document.getElementById('app').innerHTML='<div class="card bad">'+e.message+'</div>'}}

function drawOOSSummary(r){let h=r.horizons||{},cs=r.cohorts||[],best=r.best_horizon_counts||{};let bucket=(title,a)=>`<div class="sec"><h3>${title}</h3><div class="tw"><table><tr><th>Bucket</th><th>n</th><th>24h ROI</th><th>PF</th><th>Win</th><th>Median</th></tr>${(a||[]).map(x=>`<tr><td>${x.label}</td><td>${x.n}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td></tr>`).join('')}</table></div></div>`;let out=`<div class="grid"><div class="card"><div class="muted">FROZEN OOS</div><div class="big">${r.cohort_n}/${r.target_n}</div></div><div class="card"><div class="muted">COMPLETE ALL HORIZONS</div><div class="big">${r.complete_all_horizons||0}</div></div><div class="card"><div class="muted">MODE</div><div class="big">READ-ONLY</div></div></div><div class="sec"><div class="card"><b>${r.locked_definition}</b><div class="muted">Aggregate of frozen Review #1 + #2 + #3. Trading logic is untouched.</div></div></div>`;out+=`<div class="sec"><h3>Combined OOS 1–45 by horizon</h3><div class="tw"><table><tr><th>Horizon</th><th>n</th><th>ROI</th><th>PF</th><th>Win</th><th>Median</th><th>PnL</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.n}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td><td class="${cl(x.pnl)}">$${f(x.pnl,2)}</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>Review #1 vs #2 vs #3</h3><div class="tw"><table><tr><th>Horizon</th>${cs.map(c=>`<th>${c.label} ROI</th><th>${c.label} PF</th>`).join('')}</tr>${[180,360,720,1440].map(k=>`<tr><td>${hn(k)}</td>${cs.map(c=>{let x=c.horizons[k]||c.horizons[String(k)]||{};return `<td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td>`}).join('')}</tr>`).join('')}</table></div></div>`;out+=bucket('Combined 24h result by entry price',r.price_buckets)+bucket('Combined 24h result by Acceleration',r.accel_buckets);out+=`<div class="sec"><h3>Best observed checkpoint across OOS 1–45</h3><div class="card">${['3h','6h','12h','24h'].map(k=>`${k}: <b>${best[k]||0}</b>`).join(' · ')}</div></div>`;document.getElementById('app').innerHTML=out}

function drawStability(r){const pct=x=>x==null?'—':Number(x).toFixed(1)+'%',pf=x=>x==null?'—':x==='Infinity'?'∞':Number(x).toFixed(2),cell=x=>'<td>'+x+'</td>',table=(headers,rows)=>'<div class="tw"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(cell).join('')+'</tr>').join('')+'</tbody></table></div>',st=x=>[x.n,pct(x.roi),pf(x.pf),pct(x.win),pct(x.median)];let out='<div class="card"><b>Pilot v2 · Stability Audit (first 100 matured)</b><p>'+r.definition+'</p><div class="muted">READ-ONLY · '+r.complete_n+' paired complete / '+r.cohort_n+' selected</div></div>';out+='<h3 class="sec">Same complete trades across horizons</h3>'+table(['Horizon','n','ROI','PF','Win','Median'],[180,360,720,1440].map(h=>[h/60+'h',...st(r.horizons[h])]));out+='<h3 class="sec">Sequential groups of 25 trades</h3>'+table(['Group','3h ROI','6h ROI','12h ROI','24h ROI','24h PF'],r.quarters.map(q=>[q.label,...[180,360,720,1440].map(h=>pct(q.horizons[h].roi)),pf(q.horizons[1440].pf)]));out+='<h3 class="sec">Single-outlier sensitivity (same complete trades)</h3>'+table(['Horizon','Normal','Without best','Without worst','Without both','Best','Worst'],[180,360,720,1440].map(h=>{let x=r.robustness[h];return [h/60+'h',pct(x.normal.roi),pct(x.without_best.roi),pct(x.without_worst.roi),pct(x.without_both.roi),pct(x.best),pct(x.worst)]}));for(let [title,rows] of [['24h by entry price',r.price_buckets],['24h by acceleration',r.accel_buckets]])out+='<h3 class="sec">'+title+'</h3>'+table(['Bucket','n','ROI','PF','Win','Median'],rows.map(x=>[x.label,...st(x)]));out+='<h3 class="sec">Paired holding transitions</h3>'+table(['Period','n','Improved','Declined','Unchanged','Avg Δ ROI'],Object.entries(r.transitions).map(([k,v])=>[k.replace('180','3h').replace('360','6h').replace('720','12h').replace('1440','24h'),v.n,v.improved,v.declined,v.unchanged,pct(v.avg_delta)]));out+='<p class="muted">'+r.note+'</p>';document.getElementById('app').innerHTML=out}
