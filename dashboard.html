<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pilot Dashboard</title><style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#151920;--muted:#8e98a8;--line:#272d37;--good:#4bd28a;--bad:#ff6b72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:15px system-ui,-apple-system,sans-serif}.w{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:24px;font-weight:800}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:#fff}.tabs .on{border-color:#78a7ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.big{font-size:28px;font-weight:800}.sec{margin-top:18px}.tw{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;min-width:650px;border-collapse:collapse;background:var(--card)}th,td{padding:11px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.items{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:12px}.trade{color:var(--good);font-weight:700}.skip{color:#f0b55a;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="w"><div class="top"><div><div class="title">🧪 Polymarket Pilot Dashboard</div><div class="muted">PAPER · read-only · refresh 60s</div></div><div id="upd" class="muted">Loading…</div></div><div class="tabs"><button id="v2" class="on" onclick="load('v2')">Pilot v2</button><button id="v1" onclick="load('v1')">Pilot v1</button><button id="auditv2" onclick="loadAudit()">v2 MAX_OPEN Audit</button><button id="exitaudit" onclick="loadExitAudit()">Position / Exit Audit</button></div><div id="app"></div></div><script>
let current='v2';const f=(v,d=1)=>v==null?'—':Number(v).toFixed(d),cl=v=>Number(v)>0?'good':Number(v)<0?'bad':'',hn=k=>({180:'3h',360:'6h',720:'12h',1440:'24h'})[k]||k;
function drawAudit(r){let h=r.horizons||{};let out=`<div class="grid"><div class="card"><div class="muted">V2 TRADE</div><div class="big">${r.trade_total||0}</div></div><div class="card"><div class="muted">MAX_OPEN SKIP</div><div class="big">${r.max_open_skip_total||0}</div></div><div class="card"><div class="muted">MODE</div><div class="big">READ-ONLY</div></div></div>`;out+=`<div class="sec"><h3>TRADE vs MAX_OPEN SKIP</h3><div class="tw"><table><tr><th>Horizon</th><th>Trade n</th><th>Trade ROI</th><th>Skip n</th><th>Skip ROI</th><th>Skip PF</th><th>Δ ROI</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.trade.n}</td><td class="${cl(x.trade.roi)}">${f(x.trade.roi)}%</td><td>${x.max_open_skip.n}</td><td class="${cl(x.max_open_skip.roi)}">${f(x.max_open_skip.roi)}%</td><td>${f(x.max_open_skip.pf,2)}</td><td class="${cl(x.roi_delta_skip_minus_trade)}">${f(x.roi_delta_skip_minus_trade)} pp</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>Recent MAX_OPEN skips</h3><div class="items">${(r.recent_max_open_skips||[]).map(x=>`<div class="item"><div>${x[0]}</div><div class="muted">${x[1]} · ${(Number(x[2])*100).toFixed(1)}¢ · Early ${f(x[3],1)} · A ${f(x[4],3)}</div></div>`).join('')||'<div class="muted">No MAX_OPEN skips</div>'}</div></div>`;document.getElementById('app').innerHTML=out}
function drawExitAudit(r){let h=r.horizons||{},tr=r.transitions||{},best=r.best_horizon_counts||{};let out=`<div class="grid"><div class="card"><div class="muted">V2 TRADES SEEN</div><div class="big">${r.trade_total||0}</div></div><div class="card"><div class="muted">COMPLETE 24H</div><div class="big">${r.complete_24h_trades||0}</div></div><div class="card"><div class="muted">MODE</div><div class="big">READ-ONLY</div></div></div>`;out+=`<div class="sec"><h3>Outcome by holding horizon</h3><div class="tw"><table><tr><th>Horizon</th><th>n</th><th>ROI</th><th>PF</th><th>Win</th><th>Median</th><th>PnL</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.n}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td><td class="${cl(x.pnl)}">$${f(x.pnl,2)}</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>How positions changed while holding</h3><div class="tw"><table><tr><th>Period</th><th>n</th><th>Improved</th><th>Declined</th><th>Unchanged</th><th>Avg Δ ROI</th><th>Median Δ</th></tr>${Object.entries(tr).map(([k,x])=>`<tr><td>${k}</td><td>${x.n}</td><td>${x.improved}</td><td>${x.declined}</td><td>${x.unchanged}</td><td class="${cl(x.avg_delta_roi)}">${f(x.avg_delta_roi)} pp</td><td class="${cl(x.median_delta_roi)}">${f(x.median_delta_roi)} pp</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>Best observed checkpoint per complete trade</h3><div class="card">${['3h','6h','12h','24h'].map(k=>`${k}: <b>${best[k]||0}</b>`).join(' · ')}</div></div>`;out+=`<div class="sec"><h3>Recent complete trades</h3><div class="items">${(r.recent_complete||[]).map(x=>`<div class="item"><div class="row"><span>${x.title}</span><b>${x.best_horizon} best</b></div><div class="muted">3h ${f(x.rois['3h'])}% · 6h ${f(x.rois['6h'])}% · 12h ${f(x.rois['12h'])}% · 24h ${f(x.rois['24h'])}%</div></div>`).join('')||'<div class="muted">No complete 24h trades yet</div>'}</div></div>`;document.getElementById('app').innerHTML=out}
function draw(r){let c=r.counts||{},h=r.horizons||{},rec=r.recent||[],reasons=r.reasons||[];let out=`<div class="grid"><div class="card"><div class="muted">TRADE</div><div class="big">${c.TRADE||0}</div></div><div class="card"><div class="muted">SKIP</div><div class="big">${c.SKIP||0}</div></div><div class="card"><div class="muted">OPEN</div><div class="big">${r.open??'—'}</div></div></div>`;out+=`<div class="sec"><h3>Outcomes</h3><div class="tw"><table><tr><th>Horizon</th><th>n</th><th>ROI</th><th>PF</th><th>Win</th><th>Median</th><th>PnL</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${hn(k)}</td><td>${x.n||0}</td><td class="${cl(x.roi)}">${f(x.roi)}%</td><td>${f(x.pf,2)}</td><td>${f(x.win)}%</td><td class="${cl(x.median)}">${f(x.median)}%</td><td class="${cl(x.pnl)}">$${f(x.pnl,2)}</td></tr>`).join('')}</table></div></div>`;out+=`<div class="sec"><h3>SKIP reasons</h3><div class="card">${reasons.length?reasons.map(x=>`${x[0]}: <b>${x[1]}</b>`).join(' · '):'No skips'}</div></div>`;out+=`<div class="sec"><h3>Recent decisions</h3><div class="items">${rec.map(x=>`<div class="item"><div class="row"><span>${x[0]}</span><span class="${x[1]=='TRADE'?'trade':'skip'}">${x[1]}</span></div><div class="muted">${x[2]} · ${(Number(x[3])*100).toFixed(1)}¢ · A ${f(x[4],3)} · $${f(x[5],0)}</div></div>`).join('')||'<div class="muted">No recent decisions</div>'}</div></div>`;document.getElementById('app').innerHTML=out}
async function load(v){current=v;document.getElementById('v1').classList.toggle('on',v==='v1');document.getElementById('v2').classList.toggle('on',v==='v2');document.getElementById('auditv2').classList.remove('on');document.getElementById('exitaudit').classList.remove('on');try{let q=await fetch('/api/pilot/'+v,{cache:'no-store'}),j=await q.json();if(!j.ok)throw Error(j.message||j.error);draw(j.report);document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){document.getElementById('app').innerHTML='<div class="card bad">'+e.message+'</div>'}}async function loadAudit(){current='auditv2';document.getElementById('v1').classList.remove('on');document.getElementById('v2').classList.remove('on');document.getElementById('auditv2').classList.add('on');document.getElementById('exitaudit').classList.remove('on');try{let q=await fetch('/api/pilot/v2/audit',{cache:'no-store'}),j=await q.json();if(!j.ok)throw Error(j.message||j.error);drawAudit(j.report);document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){document.getElementById('app').innerHTML='<div class="card bad">'+e.message+'</div>'}}
async function loadExitAudit(){current='exitaudit';document.getElementById('v1').classList.remove('on');document.getElementById('v2').classList.remove('on');document.getElementById('auditv2').classList.remove('on');document.getElementById('exitaudit').classList.add('on');try{let q=await fetch('/api/pilot/v2/exit-audit',{cache:'no-store'}),j=await q.json();if(!j.ok)throw Error(j.message||j.error);drawExitAudit(j.report);document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){document.getElementById('app').innerHTML='<div class="card bad">'+e.message+'</div>'}}
load('v2');setInterval(()=>current==='auditv2'?loadAudit():current==='exitaudit'?loadExitAudit():load(current),60000);
</script></body></html>
